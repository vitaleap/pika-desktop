name: Release

# 监听 `v*` 前缀的 tag 推送，自动三平台构建并创建 draft GitHub Release。
# tag 由开发者本地发布产生：
#   bun run release          # 跑 check、bump 三个版本号、生成 CHANGELOG、打 tag
#   git push --follow-tags  # 推送 commit 和 tag，触发本 workflow
on:
  push:
    tags:
      - 'v*'
  # 手动重跑：在 “Run workflow” 里把 Branch/Tag 选成要重发的 tag 即可。
  workflow_dispatch:

permissions:
  contents: write

# 同一个 ref 只允许一个构建在跑，避免并发抢着创建同一个 draft release；不打断进行中的构建。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SKIP_INSTALL_GIT_HOOKS: '1'

jobs:
  # 5 个 build job 并发时，每个 job 的 tauri-action 都会先 getReleaseByTag 再 createRelease
  # 用一个前置 job 串行创建 release，所有 build job 通过 needs 等待它完成，彻底消除竞态。
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Create or fetch release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}

  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: create-release
    # workflow_dispatch 手动触发时 ref 可能不是 tag（例如 main），跳过以免生成错误的 release。
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 拆成 Apple Silicon / Intel 两个独立构建，分别产 dmg，体积更小。
          - os: macos-latest
            label: macOS (Apple Silicon)
            args: --target aarch64-apple-darwin
            rustTarget: aarch64-apple-darwin
          - os: macos-latest
            label: macOS (Intel)
            args: --target x86_64-apple-darwin
            rustTarget: x86_64-apple-darwin
          - os: ubuntu-latest
            label: Linux (amd64)
            args: ''
          - os: ubuntu-24.04-arm
            label: Linux (arm64)
            args: ''
          - os: windows-latest
            label: Windows
            args: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun ci

      - name: Setup rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.rustTarget }}

      # Use the current version section of CHANGELOG.md (generated by commit-and-tag-version) as the release body.
      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          changelog_url="https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md"
          notes=$(awk '/^## /{n++} n==1{print} n==2{exit}' CHANGELOG.md | tail -n +2)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            notes="No changes were classified as Features or Bug Fixes in this release."
          fi
          # 下载链接前缀：https://github.com/<repo>/releases/download/<tag>/Pika_<version>_...
          # 这里只列出最通用且文件名命名稳定的几种 bundle，避免 deb/rpm/AppImage
          # 之间 amd64/x86_64、arm64/aarch64 命名不一致导致链接 404。
          # 注意：github.ref_name 带 v 前缀（如 v0.1.10），但 releaseAssetNamePattern 的
          # [version] 来自 Cargo.toml 的 version，是去 v 的（如 0.1.10），要对应实际资产名。
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          download_base="https://github.com/${{ github.repository }}/releases/download/${tag}/Pika_${version}"
          {
            echo 'body<<RELEASE_NOTES_EOF'
            printf '%s\n\n' "$notes"
            echo "See [CHANGELOG.md](${changelog_url}) for the full changelog."
            echo ''
            echo ''
            echo '## 下载'
            echo ''
            echo '| 平台    | 架构           | 安装包     | 下载  |'
            echo '| ------- | ------------- | --------- | ---- |'
            echo "| Windows | x64           | .exe      | [下载](${download_base}_windows_x64.exe) |"
            echo "| Windows | x64           | .msi      | [下载](${download_base}_windows_x64.msi) |"
            echo "| macOS   | Apple Silicon | .dmg      | [下载](${download_base}_darwin_aarch64.dmg) |"
            echo "| macOS   | Intel         | .dmg      | [下载](${download_base}_darwin_x64.dmg) |"
            echo "| Linux   | amd64         | .AppImage | [下载](${download_base}_linux_amd64.AppImage) |"
            echo "| Linux   | arm64         | .AppImage | [下载](${download_base}_linux_aarch64.AppImage) |"
            echo ''
            echo ''
            echo '## macOS 安装提示'
            echo '如果打开应用时提示：'
            echo ''
            echo '> “Pika.app”已损坏，无法打开。 你应该将它移到废纸篓。'
            echo ''
            echo '请在终端执行以下命令后重新打开：'
            echo '```bash'
            echo 'sudo xattr -r -d com.apple.quarantine /Applications/Pika.app'
            echo '```'
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # 同时提供私钥后，tauri-action 会自动生成 latest.json（带 ed25519 签名）
      # 并随 release assets 上传，客户端 updater 的 endpoints 就能正确拉取。
      - name: Build and publish bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          args: ${{ matrix.args }}
          retryAttempts: 2
          releaseAssetNamePattern: '[name]_[version]_[platform]_[arch][ext]'
          # 显式声明 latest.json 上传（虽然默认就是 true，为了避免后续默认值变更）
          uploadUpdaterJson: true
          # macOS .app.tar.gz 的 .sig 也会自动生成并上传，不需要客户端参与校验
          uploadUpdaterSignatures: true

  # tauri-action 默认会把 latest.json 里的 url 写成 https://api.github.com/repos/.../releases/assets/<id>，
  # 这个 GitHub API 端点在国内受限且容易被 rate limit 误判 403，导致客户端 download 阶段完全拉不到安装包。
  # 这里把 url 改写成 https://github.com/<repo>/releases/download/<tag>/<filename>，
  # 这样客户端走任意 GitHub 反代 (gh-proxy.com / ghfast.top) 都能正常下载。
  fix-latest-json:
    name: Rewrite latest.json urls
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup bun
        uses: ./.github/actions/setup-bun

      # 仅调用 bun 脚本，依赖只有 bun 内置 API + gh CLI，不需要项目依赖。
      - name: Rewrite urls
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun run scripts/fix-latest-json.ts
