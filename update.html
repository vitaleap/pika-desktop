<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
      html,
      body,
      #app,
      .app-loader-wrapper {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
      }
      body {
        background: #2f2f2f;
        color: #f6f6f6;
      }
      .app-loader-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-loader {
        width: 1.5rem;
        aspect-ratio: 1;
        display: grid;
        border-radius: 50%;
        background:
          linear-gradient(0deg, rgb(100 100 100/50%) 30%, #0000 0 70%, rgb(100 100 100/100%) 0)
            50%/8% 100%,
          linear-gradient(90deg, rgb(100 100 100/25%) 30%, #0000 0 70%, rgb(100 100 100/75%) 0)
            50%/100% 8%;
        background-repeat: no-repeat;
        animation: l23 1s infinite steps(12);
      }
      .app-loader::before,
      .app-loader::after {
        content: '';
        grid-area: 1/1;
        border-radius: 50%;
        background: inherit;
        opacity: 0.915;
        transform: rotate(30deg);
      }
      .app-loader::after {
        opacity: 0.83;
        transform: rotate(60deg);
      }
      @keyframes l23 {
        100% {
          transform: rotate(1turn);
        }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="app-loader-wrapper">
        <div class="app-loader"></div>
      </div>
    </div>
    <script>
      if (window.location.hash !== '#/update') {
        history.replaceState(null, '', '#/update')
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
